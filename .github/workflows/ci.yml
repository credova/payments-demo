name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install runtimes (bun, node, hk)
        uses: credova/platform-workflows/actions/setup-mise@master
        with:
          # Versions come from mise.toml at the repo root.
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: hk check --all

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

  gate:
    name: Gate
    needs:
      - build
    if: always()
    runs-on: warp-ubuntu-2404-x64-2x
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::a required job concluded '$result'"
                exit 1
                ;;
            esac
          done
