name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install runtimes (bun, node, hk)
        uses: jdx/mise-action@v4
        with:
          # Versions come from mise.toml at the repo root.
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: hk check --all

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build
